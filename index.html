<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050816">
<title>BALL — Arkanoid</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{touch-action:none}
#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,#16244d 0,#080d22 45%,#03050d 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;right:0;height:62px;padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#050816ee,#05081699,transparent);z-index:5}
.stat{text-align:center;min-width:72px}.small{font-size:9px;color:#93a0c8;text-transform:uppercase;letter-spacing:.18em}.big{font-size:18px;font-weight:900}
#pause{border:1px solid #ffffff22;background:#ffffff0d;color:#fff;border-radius:12px;width:42px;height:36px;font-size:16px}
#overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:#02040bcc;backdrop-filter:blur(8px)}
.card{width:min(420px,100%);padding:32px 24px;border:1px solid #ffffff18;border-radius:28px;text-align:center;background:linear-gradient(145deg,#121b38f5,#090e21f5);box-shadow:0 25px 100px #0009}
.logo{font-size:58px;line-height:.9;font-weight:1000;letter-spacing:-.07em;margin-bottom:12px;text-shadow:0 0 30px #62d8ff99}
.card h2{margin:0 0 8px;font-size:28px}.card p{color:#9da8c8;line-height:1.5;margin:8px 0 18px}
button.main{border:0;border-radius:999px;padding:15px 32px;background:linear-gradient(90deg,#fff,#bdeeff);color:#071020;font-size:16px;font-weight:900;box-shadow:0 8px 30px #6ddcff33}
.sub{margin-top:14px;font-size:12px;color:#7180a7}
#levelFlash{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;pointer-events:none;font-size:44px;font-weight:1000;text-shadow:0 0 35px #55d9ff}
#power{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:6;display:none;padding:6px 12px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff1c;font-size:11px;font-weight:800}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="hud">
 <div class="stat"><div class="small">Score</div><div id="score" class="big">0</div></div>
 <div class="stat"><div class="small">Level</div><div id="level" class="big">1</div></div>
 <div class="stat"><div class="small">Lives</div><div id="lives" class="big">3</div></div>
 <button id="pause" aria-label="Pause">Ⅱ</button>
</div>
<div id="power"></div><div id="levelFlash">LEVEL 1</div>
<div id="overlay"><div class="card">
 <div class="logo">BALL</div><h2 id="title">ARKANOID</h2>
 <p id="message">Break the bricks, catch the power-ups and survive as long as you can.</p>
 <button class="main" id="start">START GAME</button>
 <div class="sub">📱 Drag anywhere on the screen to move the paddle</div>
</div></div>
</div>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),livesEl=document.getElementById('lives'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),message=document.getElementById('message'),start=document.getElementById('start'),pause=document.getElementById('pause'),flash=document.getElementById('levelFlash'),powerEl=document.getElementById('power');
let W,H,D=1,score=0,level=1,lives=3,running=false,paused=false,last=0,drag=false,audio=null,shake=0,flashTimer=0;
let bricks=[],parts=[],drops=[],balls=[],power={wide:0,slow:0,multi:0};
const colors=['#ff4f70','#ff9e43','#ffd166','#40e0c0','#48a7ff','#9b63ff','#f25cff'];
const paddle={x:0,y:0,w:100,h:13};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function resize(){let r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);paddle.y=H-Math.max(42,H*.075);paddle.w=power.wide?Math.min(175,W*.38):Math.min(112,Math.max(78,W*.25));paddle.x=clamp(paddle.x||W/2-paddle.w/2,5,W-paddle.w-5)}
addEventListener('resize',resize);
function beep(f,d=.05){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function hud(){scoreEl.textContent=score;levelEl.textContent=level;livesEl.textContent=lives}
function layout(){
 bricks=[];let cols=W<520?7:10, rows=Math.min(5+Math.floor((level-1)/2),9),gap=W<520?5:7,side=W<520?10:30,bw=(W-side*2-gap*(cols-1))/cols,bh=clamp(H*.033,17,26),top=Math.max(72,H*.09);
 for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){
  let type='normal'; if(level>=3&&Math.random()<.13)type='strong'; if(level>=4&&Math.random()<.06)type='steel';
  bricks.push({x:side+q*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,hp:type==='strong'?2:type==='steel'?3:1,max:type==='strong'?2:type==='steel'?3:1,color:colors[r%colors.length],type,alive:true});
 }}
function newBall(vx=null){
 let speed=Math.min(720,330+level*25),a=(Math.random()*.9-.45);
 return {x:W/2,y:paddle.y-18,r:clamp(W*.018,6,9),vx:vx??speed*Math.sin(a),vy:-Math.abs(speed*Math.cos(a)),stuck:true};
}
function resetBalls(){balls=[newBall()]}
function startGame(){score=0;level=1;lives=3;power={wide:0,slow:0,multi:0};running=true;paused=false;overlay.style.display='none';layout();resetBalls();hud();powerEl.style.display='none';showLevel();beep(520,.08)}
function showLevel(){flash.textContent='LEVEL '+level;flash.style.display='flex';clearTimeout(flashTimer);flashTimer=setTimeout(()=>flash.style.display='none',850)}
function next(){level++;layout();resetBalls();hud();showLevel();beep(760,.08)}
function lose(){lives--;hud();shake=10;beep(100,.15);if(lives<=0){running=false;title.textContent='GAME OVER';message.textContent='Score '+score+'  •  Level '+level;start.textContent='PLAY AGAIN';overlay.style.display='flex'}else resetBalls()}
function move(px){paddle.x=clamp(px-paddle.w/2,5,W-paddle.w-5);if(balls.length)for(let b of balls)if(b.stuck)b.x=paddle.x+paddle.w/2}
function pos(e){return e.clientX}
c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture?.(e.pointerId);move(pos(e))});
c.addEventListener('pointermove',e=>{if(drag)move(pos(e))});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
function launch(){for(let b of balls)b.stuck=false}
c.addEventListener('pointerup',launch);
pause.onclick=()=>{if(running){paused=!paused;pause.textContent=paused?'▶':'Ⅱ';if(paused)beep(180,.04)}};
start.onclick=startGame;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(paddle.x+paddle.w/2-55);if(e.key==='ArrowRight')move(paddle.x+paddle.w/2+55);if(e.key===' '){if(!running)startGame();else if(paused){paused=false;pause.textContent='Ⅱ'}else{launch();paused=true;pause.textContent='▶'}e.preventDefault()}});
function particle(px,py,col,n=8){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.55,c:col})}
function drop(px,py){let types=['W','S','M','+'];if(Math.random()>.22)return;let t=types[Math.floor(Math.random()*types.length)];drops.push({x:px,y:py,w:28,h:18,vy:80,t})}
function apply(t){if(t==='W'){power.wide=10;paddle.w=Math.min(175,W*.38)}if(t==='S')power.slow=8;if(t==='M'){power.multi=1;if(balls.length<3){let b=balls[0];balls.push({x:b.x,y:b.y,vx:-b.vx,vy:b.vy,r:b.r,stuck:false})}}if(t==='+'){lives++;hud()}powerEl.textContent=t==='W'?'WIDE PADDLE':t==='S'?'SLOW BALL':t==='M'?'MULTI BALL':'EXTRA LIFE';powerEl.style.display='block';setTimeout(()=>{if(powerEl)powerEl.style.display='none'},1500);beep(900,.1)}
function rectHit(b,r){return b.x+b.r>=r.x&&b.x-b.r<=r.x+r.w&&b.y+b.r>=r.y&&b.y-b.r<=r.y+r.h}
function update(dt){
 if(!running||paused)return;dt=Math.min(dt,.025);let slow=power.slow?0.68:1;
 power.wide=Math.max(0,power.wide-dt);power.slow=Math.max(0,power.slow-dt);
 if(!power.wide)paddle.w=Math.min(112,Math.max(78,W*.25));
 for(let i=balls.length-1;i>=0;i--){let b=balls[i];if(b.stuck){b.x=paddle.x+paddle.w/2;b.y=paddle.y-b.r-2;continue}b.x+=b.vx*dt*slow;b.y+=b.vy*dt*slow;
  if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx);beep(180)}if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx);beep(180)}if(b.y-b.r<60){b.y=60+b.r;b.vy=Math.abs(b.vy);beep(180)}
  if(rectHit(b,{x:paddle.x,y:paddle.y,w:paddle.w,h:paddle.h})&&b.vy>0){let hit=clamp((b.x-(paddle.x+paddle.w/2))/(paddle.w/2),-1,1),sp=Math.min(760,Math.hypot(b.vx,b.vy)*1.012),ang=hit*1.18;b.vx=sp*Math.sin(ang);b.vy=-Math.abs(sp*Math.cos(ang));b.y=paddle.y-b.r-2;beep(260)}
  let hitBrick=null;
  for(let q of bricks)if(q.alive&&rectHit(b,q)){hitBrick=q;break}
  if(hitBrick){let q=hitBrick;q.hp--;score+=q.type==='steel'?5:10;hud();particle(b.x,b.y,q.color);if(q.hp<=0){q.alive=false;score+=q.max*10;drop(q.x+q.w/2,q.y+q.h/2);beep(360+level*20)}else beep(230);let ox=Math.min(b.x+b.r-q.x,q.x+q.w-(b.x-b.r)),oy=Math.min(b.y+b.r-q.y,q.y+q.h-(b.y-b.r));if(ox<oy)b.vx*=-1;else b.vy*=-1;shake=3}
  if(b.y-b.r>H)balls.splice(i,1);
 }
 for(let i=drops.length-1;i>=0;i--){let d=drops[i];d.y+=d.vy*dt;if(d.y>H)drops.splice(i,1);else if(d.y+d.h>=paddle.y&&d.x+d.w>=paddle.x&&d.x<=paddle.x+paddle.w){apply(d.t);drops.splice(i,1)}}
 if(!balls.length)lose();
 if(bricks.length&&!bricks.some(b=>b.alive)){score+=100*level;hud();next()}
 for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
}
function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r)}
function draw(){
 x.clearRect(0,0,W,H);x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.2)shake=0}
 // background stars
 x.fillStyle='#ffffff18';for(let i=0;i<70;i++){let sx=(i*97)%W,sy=70+(i*53)%(Math.max(1,H-100));x.fillRect(sx,sy,1.5,1.5)}
 for(let b of bricks)if(b.alive){x.shadowBlur=b.type==='steel'?8:5;x.shadowColor=b.color;x.fillStyle=b.type==='steel'?'#667089':b.color;rr(b.x,b.y,b.w,b.h,5);x.fill();x.shadowBlur=0;x.fillStyle='#ffffff35';rr(b.x+2,b.y+2,b.w-4,Math.max(3,b.h*.22),3);x.fill();if(b.hp>1){x.fillStyle='#ffffffaa';x.font='bold 10px system-ui';x.textAlign='center';x.fillText(b.hp,b.x+b.w/2,b.y+b.h*.72)}}
 for(let d of drops){let cc=d.t==='W'?'#4cc9f0':d.t==='S'?'#ffd166':d.t==='M'?'#c77dff':'#7dff9a';x.fillStyle=cc;x.shadowColor=cc;x.shadowBlur=12;rr(d.x,d.y,d.w,d.h,8);x.fill();x.shadowBlur=0;x.fillStyle='#061020';x.font='900 11px system-ui';x.textAlign='center';x.fillText(d.t,d.x+d.w/2,d.y+13)}
 x.shadowColor='#7be6ff';x.shadowBlur=18;x.fillStyle='#f8fdff';rr(paddle.x,paddle.y,paddle.w,paddle.h,8);x.fill();x.shadowBlur=0;
 for(let b of balls){x.shadowColor='#fff';x.shadowBlur=20;x.fillStyle='#fff';x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill()}
 for(let p of parts){x.globalAlpha=Math.max(0,p.life/.55);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,3,0,Math.PI*2);x.fill()}x.globalAlpha=1;x.restore();
}
function loop(t){let dt=(t-last)/1000||0;last=t;update(dt);draw();requestAnimationFrame(loop)}
resize();hud();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
